<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Student Registration</h1>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/student/register}" th:object="${student}" method="post">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" th:field="*{firstName}" required>
        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>

        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" th:field="*{lastName}" required>
        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="age">Age</label>
        <input type="number" id="age" th:field="*{age}" min="1" required>
        <span class="field-error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>

        <button type="submit">Register</button>
    </form>

    <p class="nav"><a th:href="@{/student/all}">View all students &rarr;</a></p>
</div>
</body>
</html>
